name: LV2 validation

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag for a GitHub release draft (e.g. lv2-v0.1.0). Leave blank to build only.
        type: string
        required: false

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake lv2-dev lilv-utils libgtk2.0-dev
      - name: Build LV2
        run: |
          cmake -S lv2 -B build-lv2 -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-Wall -Wextra -Werror"
          cmake --build build-lv2 --parallel
      - name: Test LV2 and report DSP timing
        run: ctest --test-dir build-lv2 --verbose --output-on-failure
      - name: Build standalone GTK2 with OSS
        run: |
          sources=$(awk '/^gnuitar_SOURCES =/{collect=1} collect && /^$/{exit} collect{for(i=1;i<=NF;i++) if($i ~ /\.c$/) print "src/" $i}' src/Makefile.am)
          cc -std=gnu99 -O2 -ffast-math -Wno-deprecated-declarations -D_GNU_SOURCE \
             -DHAVE_GTK2 -DHAVE_OSS -DFLOAT_DSP '-DVERSION="0.3.2"' '-DG_LOG_DOMAIN="gnuitar"' \
             $(pkg-config --cflags gtk+-2.0 gthread-2.0) $sources \
             $(pkg-config --libs gtk+-2.0 gthread-2.0) -lm -o build-lv2/gnuitar-standalone
      - name: Compare Tube Amplifier with the original 44.1 kHz mono DSP
        run: |
          reference=45f828f08215ac710316056decf64889c11b2afc
          git fetch --depth=1 origin "$reference"
          mkdir -p build-lv2/legacy
          git show "$reference:src/tubeamp.c" > build-lv2/legacy/tubeamp.c
          git show "$reference:src/tubeamp.h" > build-lv2/legacy/tubeamp.h
          cc -std=gnu99 -O2 -D_GNU_SOURCE -DHAVE_GTK2 -DFLOAT_DSP -Wno-deprecated-declarations \
             -Ibuild-lv2/legacy -Isrc $(pkg-config --cflags gtk+-2.0 gthread-2.0) \
             lv2/tests/tubeamp_legacy_compare.c build-lv2/legacy/tubeamp.c src/biquad.c \
             $(pkg-config --libs gtk+-2.0 gthread-2.0) -lm -ldl -o build-lv2/tubeamp-legacy-compare
          build-lv2/tubeamp-legacy-compare "$PWD/build-lv2/bundles/gnuitar.lv2/gnuitar.so"

  linux-release-candidate:
    name: Linux LV2 release candidate
    needs: linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging and verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake lv2-dev lilv-utils
      - name: Build and stage the LV2 bundle
        run: |
          cmake -S lv2 -B build-lv2 -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Werror" -DGNUITAR_LV2_INSTALL_DIR=lv2
          cmake --build build-lv2 --parallel
          cmake --install build-lv2 --prefix "$PWD/stage"
      - name: Package the release candidate
        run: |
          mkdir -p dist
          commit=$(git rev-parse HEAD)
          timestamp=$(git show -s --format=%ct HEAD)
          archive="dist/gnuitar-lv2-linux-x86_64-${commit:0:12}.tar.gz"
          tar --sort=name --mtime="@${timestamp}" --owner=0 --group=0 --numeric-owner \
            -C stage/lv2 -cf - gnuitar.lv2 | gzip -n > "$archive"
      - name: Verify the extracted bundle
        run: |
          mkdir extracted
          tar -xzf dist/*.tar.gz -C extracted
          LV2_PATH="$PWD/extracted" cmake -DLV2LS=lv2ls -DLV2INFO=lv2info \
            -P lv2/tests/discovery.cmake
          build-lv2/test_pilot "$PWD/extracted/gnuitar.lv2/gnuitar.so"
      - name: Upload the validated Linux archive
        uses: actions/upload-artifact@v4
        with:
          name: gnuitar-lv2-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  linux-release-draft:
    name: Prepare GitHub release draft
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch &&
      inputs.release_tag != ''
    needs: linux-release-candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: lv2-release-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gnuitar-lv2-linux-x86_64
          path: dist
      - name: Create a draft with the validated tarball
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^lv2-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a tag such as lv2-v0.1.0."
            exit 1
          fi
          archive="dist/gnuitar-lv2-linux-x86_64-${GITHUB_SHA:0:12}.tar.gz"
          test -s "$archive"

          tags=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq '.[].ref')
          if grep -Fxq "refs/tags/$RELEASE_TAG" <<< "$tags"; then
            echo "::error::The requested release tag already exists."
            exit 1
          fi

          gh release create "$RELEASE_TAG" "$archive" \
            --draft --target "$GITHUB_SHA" \
            --title "GNUitar LV2 ${RELEASE_TAG#lv2-v}" --notes-file lv2/RELEASE_NOTES.md
